# Template — do NOT commit with real values.
# Create with: kubectl apply -f k8s/secrets.yaml
# Or use a secrets manager (e.g. Sealed Secrets, External Secrets Operator).
#
# Generate encryption keys with:
#   bundle exec rails runner "puts ActiveRecord::Encryption::KeyGenerator.new.generate_random_alg_key"
# Or:
#   ruby -rsecurerandom -e "puts SecureRandom.hex(32)"
apiVersion: v1
kind: Secret
metadata:
  name: ecp-secrets
  namespace: ecp
type: Opaque
stringData:
  DATABASE_URL: "postgres://ecp:CHANGEME@postgres:5432/ecp_production"
  SECRET_KEY_BASE: "CHANGEME_run_rails_secret"
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "CHANGEME_32_hex_chars"
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "CHANGEME_32_hex_chars"
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "CHANGEME_32_hex_chars"
