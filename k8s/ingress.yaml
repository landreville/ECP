# Adjust annotations to match your ingress controller (nginx, traefik, etc.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp
  namespace: ecp
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Required for SSE (Server-Sent Events) — disable buffering
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: ecp.example.com   # Change to your hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecp
                port:
                  name: http
  tls:
    - hosts:
        - ecp.example.com
      secretName: ecp-tls    # cert-manager or pre-existing TLS secret
